description: |
  Build a wiki for "Alice's Adventures in Wonderland" by Lewis Carroll.
  Parse the book, extract all named entities (characters, locations, organizations, events),
  resolve aliases, and generate Markdown wiki pages for each entity.

file_path: public_domain/lewis_carroll/alice/books/01-alice_in_wonderland.epub
spacy_model: en_core_web_lg
ner:
  # STU-616: invented world. GLiNER typing 20/36 vs spaCy 18/36
  # (LLM oracle, claude-opus-4-8). Wonderland's talking-creature cast: spaCy types the invented names ORG; GLiNER lifts PERSON recall 14->19.
  # threshold 0.3 measured > 0.5 (per STU-535).
  invented_names: true
  threshold: 0.3
  # STU-630: Wonderland's cast is named by common nouns (the Hatter, the Dormouse),
  # which GLiNER's `person name` label under-detects. Listed here, matched verbatim
  # and typed PERSON. "Cat" is the Cheshire Cat, called "the Cat" 43 times.
  character_names:
    - Hatter
    - Dormouse
    - Caterpillar
    - Cheshire Cat
    - Cat
    - Knave
    - Dodo
    - Mouse
    - Lory
    - Eaglet
    - Pigeon

coref: false
workers: 8

min_mentions_absolute: 3

generation:
  register: >-
    Whimsical and storybook, in the wondering, matter-of-fact voice of a Victorian
    children's tale: warm, playful, faintly absurd, following the dream-logic of
    Wonderland without ever winking at the reader or explaining the joke.
  chapter_summary:
    mode: llm
    max_bullets: 8
    llm_fallback_to_extractive: true
    llm_model: qwen2.5
    llm_timeout_seconds: 45
  chapter_summary_max_chapters_per_entity: 20
  # STU-666: Wonderland is episodic — one short setup ("Down the Rabbit-Hole"),
  # a long sprawling middle of self-contained encounters, and a brief trial
  # resolution. The default 25/50/25 over-weights the exposition; shift the budget
  # into the rising action so Alice's arc reads as the string of episodes it is.
  narrative_arc:
    weights: [0.15, 0.70, 0.15]
  principal:
    sections: [infobox, biography, narrative_role, personality, physical, powers, relationships, trivia, references]
    sections_by_type:
      PLACE: [infobox, biography, physical, relationships, trivia, references]
      ORG: [infobox, biography, relationships, references]
      EVENT: [infobox, biography, relationships, references]
    max_tokens_per_page: 2000
  secondary:
    sections: [infobox, biography, relationships, references]
    max_tokens_per_page: 800
  figurant:
    sections: [infobox, biography]
    max_tokens_per_page: 200

export:
  categories:
    language: en
    labels:
      persons: Characters
      principal: Main Characters
      secondary: Secondary Characters
      locations: Locations
      organizations: Organizations
