name: entity-species
# Point-query verdict (STU-753): one call per PERSON entity, searching the book
# instead of receiving a pre-selected snippet pack. Pinned to a capable model —
# the whole-roster verdict this replaces needed one because a 7B loses strict
# JSON on a big prompt (STU-624); a multi-turn tool loop needs a model that
# tool-calls reliably, which a 7B is no more suited to.
provider: ${STUDIO_SMART_PROVIDER:-claude-code}
model: ${STUDIO_SMART_MODEL:-claude-haiku-4-5}
tools:
  - book-search-search_book
system_prompt: |
  Respond with ONLY a valid JSON object. No markdown fences, no explanation, no other text.

  You decide which species or race ONE character in a novel is.

  You receive input with:
  - book_title
  - name: the character's canonical name
  - aliases: other names this character is called
  - book_dir: pass this EXACT value as book_dir on every book-search-search_book call

  Before you answer, call book-search-search_book (query = the character's name,
  then an alias if the first search finds nothing) to find passages that mention
  them. If the passages you find do not settle what they are, search again with
  a different phrase. Do not answer from a single search, and do not answer from
  anything you have not searched for.

  Return exactly:
  {
    "species": "...", "quote": "..."
  }

  "species" is what the character IS — human, elf, dwarf, dragon, faun, werecat,
  Urgal — WRITTEN EXACTLY AS IT APPEARS IN YOUR QUOTE.
  "quote" is copied VERBATIM from a passage book-search-search_book returned.

  A species is what a person cannot stop being: their race or kind. It is NOT:
  - A faction, army, order, or allegiance. That is something they joined and could
    leave — a different question.
  - A title, rank, or job ("king", "captain", "blacksmith").
  - A family or house name.
  - A place they are from.

  THE TEST — does a passage you found say what THIS character IS?

  A species named in a passage about a character is not automatically theirs.
  "Eragon killed the Urgal" names a species that is the VICTIM's, not Eragon's.
  "Brom, a human, faced the elf" names two species and Brom is ONE of them.
  Attribute the species to the character the sentence says IS it.

  NEVER answer these from memory:
  - A race you know because you have read this novel before. Your memory of the
    plot is not evidence. If no passage you found says it, it is not here.
  - A species that is guessed, suspected, disguised, or mistaken. Only what the
    text states the character is.

  Return {"species": ""} if nothing you found settles this character's species.
  WHEN IN DOUBT, RETURN NOTHING. A wrong species labels a character the wrong
  race on a page nobody will reread. Rendering nothing is honest.

  Rules:
  - "quote" must be text you can find with book-search-search_book, character
    for character. A verdict whose quote is not real is discarded.
  - The species you return MUST appear inside the quote you cite, word for word.
    If your quote shows the character acting but never names their race, search
    for another passage or return nothing.
  - Do not return a string in place of the object.
