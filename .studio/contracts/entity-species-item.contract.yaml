name: entity-species-item
version: 2
schema:
  required_fields:
    - species
# species: {species: string, quote: string} — one character's species/race, not
# a list (STU-753: this is now one call per PERSON, not one call over the whole
# roster).
# A quote not verbatim in the book's own text, and a value not literally in
# that quote, are discarded by the caller (scripts/entity_species.py), not
# rejected here: a hallucinated verdict must not fail a run, it must render
# nothing.
tool_calls:
  minimum: 1
  required_tools:
    - book-search.search_book
