name: entity-affiliation-item
version: 2
schema:
  required_fields:
    - affiliation
# affiliation: {affiliation: string, quote: string} — one character's faction,
# not a list (STU-753: this is now one call per PERSON, not one call over the
# whole roster).
# A quote not verbatim in the book's own text, and a value not literally in
# that quote, are discarded by the caller (scripts/entity_affiliation.py), not
# rejected here: a hallucinated verdict must not fail a run, it must render
# nothing.
tool_calls:
  minimum: 1
  required_tools:
    - book-search.search_book
