name: book-search
description: Full-text search over one book's parsed chapters, for agentic point-query verdicts (STU-753)
version: 1

commands:
  - name: book-search-search_book
    description: Search this book's chapters for a literal phrase (case-insensitive); returns matching passages with their chapter id
    parameters:
      book_dir:
        type: string
        required: true
        description: This book's processing directory, given to you verbatim in the stage input — always pass it back exactly as received
      query:
        type: string
        required: true
        description: A literal phrase or name to search for — case-insensitive substring match, not a regex
    execute:
      type: shell
      command: |
        python3 -m scripts.book_search_tool --book-dir "{{book_dir}}" --query "{{query}}"
      parse_output: json

prompt_snippet: |
  You have access to book-search-search_book(book_dir, query) — full-text search
  over this book's chapters. query is a literal phrase, not a regex. Call it as
  many times as you need, with different phrases (a name, an alias, a keyword),
  before answering. Every claim you make must quote a passage this tool returned.
