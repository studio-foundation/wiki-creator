# Studio Configuration — EXAMPLE
# Copy this file to .studio/config.yaml and fill in your values.
# .studio/config.yaml is gitignored — it contains secrets and must NEVER be committed.
#
#   cp .studio/config.example.yaml .studio/config.yaml
#
# The dollar-brace substitution syntax reads from your environment, so you can
# keep keys out of the file entirely (recommended):
#
#   export ANTHROPIC_API_KEY=sk-ant-...
#
# The project runs on two model tiers, each settable from a .env (see
# .env.example):
#   - BULK  — the high-volume map fan-outs (chapter-summaries,
#     discover/classify-relationships, wiki-pages). Driven by `defaults` below.
#   - SMART — the five whole-book verdict agents (section-filter,
#     alias-adjudication, entity-status/affiliation/species), which pin
#     provider/model in their own agent yaml via the STUDIO_SMART env vars. A small
#     local model loses their strict output contract on big books (STU-624),
#     so they default to claude-code.
# Changing `defaults` changes what every BULK stage runs on.

providers:
  # Routes through a local Claude Code CLI — no API key. The default.
  claude-code: {}
  # Local, no API key required. Install: https://ollama.com
  ollama:
    baseUrl: http://localhost:11434
  # Cloud providers, billed per token. anthropic is safe to leave declared
  # with no key set — the SDK only errors on an actual call, never at
  # construction. openai is not: an empty ${VAR} makes its client throw at
  # startup, so only declare that block once you have the key.
  anthropic:
    apiKey: ${ANTHROPIC_API_KEY}
  # openai:
  #   apiKey: <set via env var once you have a key>

defaults:
  # The BULK tier. What the project's own runs and measurements use — every
  # accuracy figure in CLAUDE.md was produced here. Swap the provider and those
  # numbers no longer describe your run. The STUDIO_BULK env vars let a .env retarget
  # it without editing this file; unset falls back to the pin.
  #
  # The four BULK fan-out pipelines (chapter-summaries,
  # discover/classify-relationships, wiki-pages) declare `batch: true` on
  # their map stage (STU-757) — Anthropic's Message Batches API bills every
  # token at 50% in exchange for up to 24h to finish. That only takes effect
  # under `provider: anthropic`; claude-code has no batch endpoint (it owns
  # its own agent loop, so there is no single call to intercept) and runs the
  # stage unchanged, just not cheaper. Switch with:
  #
  #   STUDIO_BULK_PROVIDER=anthropic
  #
  # claude-code stays the shipped default until a real run measures the
  # anthropic path (STU-757).
  provider: ${STUDIO_BULK_PROVIDER:-claude-code}
  model: ${STUDIO_BULK_MODEL:-claude-haiku-4-5}

  # The zero-cost path. It is the product's long-term direction (M5: a LoRA
  # fine-tune distributed via Ollama), not a drop-in swap today: the prompts
  # are tuned against the model above and nothing has been re-measured on a
  # local one.
  #
  #   provider: ollama
  #   model: llama3:8b

api:
  port: 3700
