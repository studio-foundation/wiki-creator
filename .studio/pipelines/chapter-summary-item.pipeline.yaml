name: chapter-summary-item
description: Generate one chapter summary item with validation loop
version: 2

# STU-670: `max_iterations: 2` caps re-generation to one revalidation (was 3).
# The validator is a deterministic script; the trimmed cost is the summary LLM
# stage re-running on rejection.
stages:
  - group: summary-validation
    max_iterations: 2
    stages:
      - name: chapter-summary-item
        kind: analysis
        agent: chapter-summary
        contract: chapter-summary-item
        ralph:
          max_attempts: 3
        context:
          include:
            - input
            - group_feedback

      - name: chapter-summary-validator
        kind: validation
        executor: script
        runtime: python
        script: scripts/chapter_summary_validator.py
        contract: chapter-summary-validator
        context:
          include:
            - input
            - previous_stage_output
