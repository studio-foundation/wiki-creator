name: entity-species-verdicts
description: Fan out entity-species over the PERSON roster — one child run per character (STU-753)
version: 1

# The fan-out lives in the engine (STU-589 shape, one call per character since
# STU-753): per-item resume (STU-605) keyed on the resolved item input (name,
# aliases, passages, prompt_fingerprint). A character whose selected passages,
# the agent prompt and the book's text are unchanged since the last run resumes
# for free; any of them changing re-runs just that item.
stages:
  - map: species
    over: input.entities
    pipeline: entity-species-item
    resume: true
    concurrency: 4
    on_item_failure: collect-all
    input:
      book_title: "{{input.book_title}}"
      name: "{{item.name}}"
      aliases: "{{item.aliases}}"
      passages: "{{item.passages}}"
      prompt_fingerprint: "{{input.prompt_fingerprint}}"
