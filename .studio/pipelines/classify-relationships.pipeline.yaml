name: classify-relationships
description: Fan out relationship classification over batches of canonical pairs — one child run per ~6 pairs (STU-751)
version: 1

# The fan-out lives in the engine (STU-589): per-item resume (STU-605) replaces
# the output-artifact resume, collect-all replaces the per-pair error ladder,
# and RALPH + the classification-validation group retry inside the child. Each
# item groups ~_BATCH_SIZE pairs (`classify_relationships._batched`) instead of
# one (STU-751) — per-call fixed overhead (system prompt, type/confidence
# vocabulary) dominated a single-pair call's input, the same shape STU-603
# measured on discovery, so batching amortizes it. The resume key — the
# resolved batch input, fingerprint included — busts on a prompt/vocabulary
# edit (STU-560) and an unchanged batch replays free; a failed batch retries
# every pair in it, not just the one that failed (resume granularity coarsened
# from pair to batch, the accepted cost).
stages:
  - map: classify
    over: input.batches
    pipeline: relationship-classifier-item
    resume: true
    batch: true
    concurrency: 4
    on_item_failure: collect-all
    input:
      pairs: "{{item.pairs}}"
      prompt_fingerprint: "{{input.prompt_fingerprint}}"
