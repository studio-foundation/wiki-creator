name: wiki-series
description: Assemble one wiki across every tome of a series, then export it to wikitext
version: 1

# STU-709: run ONCE, after the per-tome loop (`wiki series run` / `make run-series`).
# The input is any tome's book yaml — the series is derived from its path, and the
# tome artifacts are read from disk (STU-455: each tome ran as its own `studio run`,
# so nothing about them reaches this pipeline through Studio context).
stages:
  # arc split (STU-720): the hub's one generative paragraph runs through a native
  # `call`, like every other LLM stage since STU-621. series-assemble used to issue
  # a nested `studio run` subprocess from inside its own stage — the last call still
  # shaped that way, and on a real run it produced no arc at all. on_failure:
  # continue keeps the STU-707 bias: a missing arc costs the hub a paragraph, never
  # the series export.
  - name: series-arc-pre
    kind: analysis
    executor: script
    runtime: python
    script: scripts/series_arc_pre.py
    contract: series-arc-pre
    timeout_ms: 300000
    context:
      include:
        - input

  - call: series-arc-verdict
    pipeline: wiki-pages
    condition: stages.series-arc-pre.output.needs_verdict == true
    on_failure: continue
    input:
      items: "{{stages.series-arc-pre.output.items}}"
      prompt_fingerprint: "{{stages.series-arc-pre.output.prompt_fingerprint}}"

  - name: series-assemble
    kind: extraction
    executor: script
    runtime: python
    script: scripts/series_assemble.py
    contract: series-assemble
    timeout_ms: 1800000
    context:
      include:
        - input
        - all_stage_outputs

  - name: series-export
    kind: extraction
    executor: script
    runtime: python
    script: scripts/series_export.py
    contract: series-export
    timeout_ms: 600000
    context:
      include:
        - input
